name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nusa_intel
          POSTGRES_USER: nusa_intel
          POSTGRES_PASSWORD: nusa_intel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nusa_intel -d nusa_intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://nusa_intel:nusa_intel_ci@localhost:5432/nusa_intel
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: mypy app
      - name: Validate public-beta production configuration contract
        env:
          APP_ENV: production
          CORS_ORIGINS: '["https://app.example.test"]'
          ALLOWED_HOSTS: '["api.example.test","localhost"]'
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test
        run: python ../scripts/verify_public_beta_config.py
      - run: alembic upgrade head
      - run: alembic current
      - name: Test critical business logic with branch coverage gate
        run: >-
          pytest
          --cov=app.opportunity.engine
          --cov=app.regional_analytics.engine
          --cov=app.control_tower.engine
          --cov=app.pipeline.normalize
          --cov=app.pipeline.quality
          --cov-report=term-missing
          --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: python -m pip install -e "./backend[dev]"
      - run: pip-audit
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Validate production Compose isolation contract
        env:
          APP_DOMAIN: app.example.test
          API_DOMAIN: api.example.test
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_USER: nusa_intel
          POSTGRES_PASSWORD: ci_only_url_safe_password_123456
        run: >-
          docker compose -f compose.production.yaml config --format json
          | python3 scripts/verify_production_compose.py
      - name: Validate production Caddy configuration
        env:
          APP_DOMAIN: app.example.test
          API_DOMAIN: api.example.test
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_USER: nusa_intel
          POSTGRES_PASSWORD: ci_only_url_safe_password_123456
        run: >-
          docker compose -f compose.production.yaml run --rm --no-deps proxy
          caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build
