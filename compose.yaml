name: nusa-intel

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  RELEASE_SHA: ${RELEASE_SHA:-development}
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nusa_intel}:${POSTGRES_PASSWORD:-nusa_intel_dev}@db:5432/${POSTGRES_DB:-nusa_intel}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:${WEB_PORT:-3100}"]}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
  BPS_API_KEY: ${BPS_API_KEY:-}
  BPS_SCHEDULE_ENABLED: ${BPS_SCHEDULE_ENABLED:-false}
  BPS_SCHEDULE_INDICATOR: ${BPS_SCHEDULE_INDICATOR:-tpt}
  BPS_SCHEDULE_INTERVAL_SECONDS: ${BPS_SCHEDULE_INTERVAL_SECONDS:-86400}
  REGULATION_ANSWER_TIMEOUT_SECONDS: ${REGULATION_ANSWER_TIMEOUT_SECONDS:-9}
  REGULATION_MAXIMUM_CONCURRENT_ANSWERS: ${REGULATION_MAXIMUM_CONCURRENT_ANSWERS:-8}
  REGULATION_ANSWER_RATE_LIMIT_REQUESTS: ${REGULATION_ANSWER_RATE_LIMIT_REQUESTS:-10}
  REGULATION_ANSWER_RATE_LIMIT_WINDOW_SECONDS: ${REGULATION_ANSWER_RATE_LIMIT_WINDOW_SECONDS:-60}

x-backend-service: &backend-service
  build:
    context: ./backend
  environment: *backend-environment
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nusa_intel}
      POSTGRES_USER: ${POSTGRES_USER:-nusa_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nusa_intel_dev}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nusa_intel} -d ${POSTGRES_DB:-nusa_intel}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend-service
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${WEB_PORT:-3100}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
